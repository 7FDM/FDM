'use strict';
const $=id=>document.getElementById(id), KEY='ahda-warehouse-training-v2';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=()=>new Date().toISOString(), date=v=>v?new Date(v).toLocaleString('ar-SA',{calendar:'gregory',dateStyle:'short',timeStyle:'short'}):'—';const day=n=>new Date(Date.now()+n*864e5).toISOString();
const labels={in:'داخل المستودع',out:'الخارج من المستودع',maint:'صيانة',off:'خارج الخدمة'}, types=['مجسم تدريبي خامل','صندوق تدريبي فارغ','بطاقة جرد تدريبية'];const seed=()=>({assets:Array.from({length:12},(_,i)=>({id:'DEMO-'+String(i+1).padStart(3,'0'),name:types[i%6],status:i===9?'maint':i===10?'off':i===7||i===8?'out':'in',holder:i===7?'مستخدم تجريبي 01':i===8?'مستخدم تجريبي 02':'',due:i===7?day(-1):i===8?day(2):'',service:day(i===2?3:30+i),condition:i===9?'بحاجة للفحص':'جيدة',accessories:'ملحقات تدريبية افتراضية'})),log:[{time:iso(),action:'تهيئة بيانات العرض',asset:'—',actor:'النظام التجريبي',note:'تم إنشاء 12 عينة تدريبية وهمية'}],handover:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')||seed()}catch{state=seed()}let role='manager',page='home',filter='',search='';const PREF_KEY='ahda-ui-preferences-v1';
const uiDefaults={theme:'light',palette:'green',size:'normal',logo:'normal',density:'normal',distribution:true,alerts:true,activity:true};
const paletteValues={green:['#116b58','#15352e','#2b5147'],navy:['#245d91','#182e49','#304e70'],slate:['#526478','#263644','#405466'],olive:['#526b30','#303e23','#4a5b37']};
let prefs={...uiDefaults};
try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||'null');if(p&&typeof p==='object'){for(const k of ['theme','palette','size','logo','density']){const options={theme:['light','dark'],palette:Object.keys(paletteValues),size:['normal','large'],logo:['small','normal','large'],density:['normal','compact']};if(options[k].includes(p[k]))prefs[k]=p[k]}for(const k of ['distribution','alerts','activity'])if(typeof p[k]==='boolean')prefs[k]=p[k]}}catch{}
function applyPrefs(){const c=paletteValues[prefs.palette];document.body.classList.toggle('dark',prefs.theme==='dark');document.body.style.setProperty('--accent',c[0]);document.body.style.setProperty('--sidebar',c[1]);document.body.style.setProperty('--nav-active',c[2]);document.body.dataset.textSize=prefs.size;document.body.dataset.logoSize=prefs.logo;document.body.dataset.density=prefs.density}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs));return true}catch{return false}}
const roleNames={officer:'الضابط المسؤول / ضابط التموين',manager:'مشرف المستودع',keeper:'أمين المستودع',};const pages=[['home','▦','لوحة التحكم'],['assets','▤','بطاقات العينات التدريبية'],['movement','⇄','الخروج والإرجاع'],['handover','☷','محضر الجرد'],['audit','◷','سجل النشاط'],['alerts','!','التنبيهات'],['settings','⚙','إعدادات الموقع']];const allowed={officer:['home','audit','alerts'],manager:['home','assets','handover','audit','alerts','settings'],keeper:['home','assets','movement','handover','audit','alerts']};function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('لم يتم حفظ التغييرات محلياً');return false}}function log(action,asset,note){state.log.unshift({time:iso(),action,asset,actor:roleNames[role],note});save()}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}function count(s){return state.assets.filter(a=>a.status===s).length}function pill(s){return `<span class="pill ${esc(s)}">${esc(labels[s]||s)}</span>`}function alerts(){return state.assets.flatMap(a=>[...(a.status==='out'&&Date.parse(a.due)<Date.now()?[{id:a.id,title:'تجاوز موعد الإرجاع',detail:a.name,cls:'late'}]:[]),...(a.status==='in'&&Date.parse(a.service)-Date.now()<7*864e5?[{id:a.id,title:'موعد فحص قريب',detail:a.name,cls:'maint'}]:[])])}function header(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}function go(p){if(!allowed[role].includes(p))return;page=p;render()}function render(){if(!allowed[role].includes(page))page=allowed[role][0];$('nav').innerHTML=pages.filter(x=>allowed[role].includes(x[0])).map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'active':''}" aria-label="${x[2]}"><span>${x[1]}</span><b class="navtext">${x[2]}</b></button>`).join('');const f={home,assets,movement,handover,audit,alertView:alertsPage,settings};$('view').innerHTML=(page==='alerts'?alertsPage:f[page])();bind()}
function home(){const n=state.assets.length;return header('لوحة التحكم','نظرة عامة على مستودع تدريبي افتراضي',`<span class="tag">عرض محلي</span>`)+`<div class="kpis">${[['قوة المستودع',n,'','إجمالي العينات الافتراضية'],['داخل المستودع',count('in'),'','داخل المستودع'],['الخارج من المستودع',count('out'),'warn','خروج تجريبي'],['الغير مسلم','—','bad','لا توجد بيانات تسليم معتمدة']].map(x=>`<div class="card kpi ${x[2]}"><i class="dot"></i><label>${x[0]}</label><strong>${x[1]}</strong><span class="muted tiny">${x[3]}</span></div>`).join('')}</div><div class="two" ${!prefs.distribution&&!prefs.alerts?'hidden':''}><section class="card ${prefs.distribution?'':'hidden'}"><div class="panelhead"><h2>توزيع الحالة</h2><span class="tag">${n} سجل</span></div><div class="bar">${['in','out','maint','off'].map((s,i)=>`<i style="width:${count(s)*100/Math.max(n,1)}%;background:${['#377d63','#7294bb','#d2a555','#b76e6e'][i]}"></i>`).join('')}</div><div class="legend">${['in','out','maint','off'].map((s,i)=>`<span><i style="background:${['#377d63','#7294bb','#d2a555','#b76e6e'][i]}"></i>${labels[s]}: ${count(s)}</span>`).join('')}</div></section><section class="card ${prefs.alerts?'':'hidden'}"><div class="panelhead"><h2>تنبيهات المتابعة</h2><button class="btn" data-page="alerts">عرض الكل</button></div>${alertRows()}</section></div><section class="card ${prefs.activity?'':'hidden'}"><div class="panelhead"><h2>أحدث النشاطات</h2><button class="btn" data-page="audit">السجل الكامل</button></div>${logTable(state.log.slice(0,5))}</section>`}
function assets(){return header('بطاقات العينات التدريبية','بحث وتصنيف السجلات الافتراضية')+`<section class="card"><div class="toolbar"><input id="search" placeholder="ابحث بالرمز أو النوع" value="${esc(search)}"><select id="filter"><option value="">كل الحالات</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select></div><div id="assetRows">${assetTable()}</div></section>`}function assetTable(){const list=state.assets.filter(a=>(!filter||a.status===filter)&&`${a.id} ${a.name}`.toLowerCase().includes(search.toLowerCase()));return `<div class="tablewrap"><table><thead><tr><th>رمز العينة</th><th>النوع</th><th>الحالة</th><th>المستلم الافتراضي</th><th>التفاصيل</th></tr></thead><tbody>${list.map(a=>`<tr><td><b class="mono">${esc(a.id)}</b></td><td>${esc(a.name)}</td><td>${pill(a.status)}</td><td>${esc(a.holder||'—')}</td><td><button class="btn" data-detail="${a.id}">عرض</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد نتائج</td></tr>'}</tbody></table></div>`}function movement(){return header('الخروج والإرجاع','محاكاة حركة عينة تدريبية خاملة')+`<div class="card"><h2>تسجيل حركة تجريبية</h2><form id="movementForm"><div class="formgrid"><div class="field"><label for="operation">العملية</label><select id="operation"><option value="out">خروج</option><option value="in">إرجاع</option></select></div><div class="field"><label for="assetCode">رمز العينة التجريبي</label><select id="assetCode">${state.assets.map(a=>`<option value="${a.id}">${a.id} — ${a.name}</option>`).join('')}</select></div><div class="field" id="holderField"><label for="holder">المستلم التجريبي</label><select id="holder"><option>مستخدم تجريبي 01</option><option>مستخدم تجريبي 02</option><option>مستخدم تجريبي 03</option></select></div><div class="field" id="dueField"><label for="due">موعد الإرجاع</label><input id="due" type="datetime-local" required></div><div class="field full"><label for="condition">حالة العينة</label><select id="condition"><option>جيدة</option><option>تحتاج فحصاً</option></select></div></div><label class="check"><input id="confirm" type="checkbox" required> أؤكد أن هذه محاكاة ببيانات افتراضية فقط</label><button class="btn primary" type="submit">حفظ الحركة التجريبية</button><div id="result" aria-live="polite"></div></form></div>`}
function handover(){return header('محضر الجرد','مطابقة العينات التدريبية الخاملة في بيئة العرض')+`<div class="two"><div class="card"><h2>محضر مطابقة جديد</h2><form id="handoverForm"><div class="formgrid"><div class="field"><label>المسلم الافتراضي</label><select id="from"><option>مناوب أ</option><option>مناوب ب</option></select></div><div class="field"><label>المستلم الافتراضي</label><select id="to"><option>مناوب ب</option><option>مناوب أ</option></select></div><div class="field"><label for="actual">العدد المشاهد داخل المستودع</label><input id="actual" type="number" min="0" max="999" required value="${state.assets.length-count('out')}"></div><div class="field"><label>العدد المتوقع داخل المستودع</label><input readonly value="${state.assets.length-count('out')}"></div></div><div class="msg" id="match">مطابقة الأعداد</div><button class="btn primary" ${role==='keeper'?'':'disabled'}>حفظ المحضر</button></form></div><div class="card"><h2>ملخص الجرد</h2>${Object.entries(labels).map(([k,v])=>`<div class="lineitem"><span>${v}</span><b>${count(k)}</b></div>`).join('')}<div class="lineitem"><b>إجمالي العينات</b><b>${state.assets.length}</b></div></div></div><div class="card"><h2>المحاضر السابقة</h2>${state.handover.length?state.handover.map(x=>`<div class="lineitem"><span>${esc(x.from)} ← ${esc(x.to)}<br><small class="muted">${date(x.time)}</small></span><span class="pill ${x.actual!==x.expected?'late':''}">${x.actual} / ${x.expected}</span></div>`).join(''):'<p class="empty">لا توجد محاضر بعد.</p>'}</div>`}function logTable(rows){return `<div class="tablewrap"><table><thead><tr><th>الوقت</th><th>الحركة</th><th>العينة</th><th>الدور</th><th>الوصف</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${date(r.time)}</td><td>${esc(r.action)}</td><td><span class="mono">${esc(r.asset)}</span></td><td>${esc(r.actor)}</td><td>${esc(r.note)}</td></tr>`).join('')}</tbody></table></div>`}function audit(){return header('سجل النشاط','سجل محلي قابل للعرض والتصدير، وليس سجلاً محصناً ضد التلاعب',`<button class="btn" id="export">تصدير CSV</button>`)+`<div class="card">${logTable(state.log)}</div>`}function alertRows(){const a=alerts();return a.length?a.map(r=>`<div class="lineitem"><div><b>${r.title}</b><br><span class="tiny muted">${r.id} · ${r.detail}</span></div><span class="pill ${r.cls}">متابعة</span></div>`).join(''):'<p class="empty">لا توجد تنبيهات حالياً</p>'}function alertsPage(){return header('التنبيهات','تُحسب عند فتح الصفحة من بيانات العرض')+`<div class="card">${alertRows()}</div>`}function settings(){const select=(id,choices)=>'<select id="'+id+'">'+choices.map(([v,label])=>'<option value="'+v+'" '+(prefs[id]===v?'selected':'')+'>'+label+'</option>').join('')+'</select>';return header('إعدادات الموقع','تخصيص مظهر النسخة التجريبية على هذا المتصفح')+`<section class="card prefs-block"><h2>المظهر والهوية</h2><form id="prefsForm"><div class="formgrid"><div class="field"><label for="pref-theme">المظهر</label>${select('theme',[['light','فاتح'],['dark','داكن']]).replace('id="theme"','id="pref-theme"')}</div><div class="field"><label for="palette">ألوان الواجهة</label>${select('palette',[['green','أخضر'],['navy','أزرق داكن'],['slate','رمادي'],['olive','زيتي']])}</div><div class="field"><label for="size">حجم النص</label>${select('size',[['normal','عادي'],['large','كبير']])}</div><div class="field"><label for="logo">حجم الشعار (كمبيوتر)</label>${select('logo',[['small','صغير'],['normal','متوسط'],['large','كبير']])}</div><div class="field"><label for="density">تباعد البطاقات والجداول</label>${select('density',[['normal','عادي'],['compact','مضغوط']])}</div></div><h2>عناصر لوحة التحكم</h2><div class="prefs-options">${[['distribution','مخطط توزيع الحالة'],['alerts','بطاقة التنبيهات'],['activity','بطاقة أحدث النشاطات']].map(([id,label])=>'<label class="check"><input type="checkbox" id="pref-'+id+'" '+(prefs[id]?'checked':'')+'> '+label+'</label>').join('')}</div><p class="muted tiny prefs-note">تخصيص العرض فقط؛ لا يغيّر السجلات أو الأدوار أو إعدادات الاستضافة. يبقى تنبيه النسخة التدريبية ظاهراً دائماً.</p><div class="prefs-actions"><button class="btn primary" type="submit">حفظ التخصيص</button><button type="button" class="btn" id="resetPrefs">استعادة الإعدادات الافتراضية</button></div></form></section><h2 style="margin-bottom:12px">حالة الربط</h2><div class="cards3">${[['GitHub','الكود المصدري','المستودع الرئيسي'],['Netlify','استضافة واجهة العرض','fdm1'],['Supabase','قاعدة البيانات والمصادقة والتخزين','الربط البرمجي غير مكتمل']].map(x=>`<div class="card"><div class="platform"><b>${x[0]}</b></div><p class="muted">${x[1]}</p><div style="margin-top:16px"><span class="tag">${x[2]}</span></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><h2>المساعد الإداري</h2><p class="muted">أسئلة تعريفية محلية، لا يوجد اتصال بنموذج AI خارجي.</p><select id="faq" style="margin:12px 0"><option value="">اختر سؤالاً</option><option value="one">كيف أجرب الحركة؟</option><option value="two">أين تُخزن البيانات؟</option><option value="three">هل النظام جاهز للإنتاج؟</option></select><div id="answer" class="muted"></div></div>`}
function msg(s,err=false){$('result').innerHTML=`<div class="msg ${err?'error':''}">${esc(s)}</div>`}function move(e){e.preventDefault();if(role!=='keeper')return;const a=state.assets.find(x=>x.id===$('assetCode').value),op=$('operation').value;if(!a||!$('confirm').checked)return msg('تأكد من البيانات',true);if(op==='out'&&a.status!=='in')return msg('العينة غير متاح للحركة التجريبية',true);if(op==='in'&&a.status!=='out')return msg('العينة غير مسجل خارج المستودع',true);const due=op==='out'?new Date($('due').value):null;if(due&&(!Number.isFinite(+due)||+due<=Date.now()))return msg('اختر موعداً مستقبلياً',true);a.status=op==='out'?'out':$('condition').value==='جيدة'?'in':'maint';a.holder=op==='out'?$('holder').value:'';a.due=due?due.toISOString():'';a.condition=$('condition').value;log(op==='out'?'خروج تجريبي':'إرجاع تجريبي',a.id,a.condition);$('confirm').checked=false;msg('تم تسجيل الحركة محلياً');}function bind(){if(page==='assets'){$('search').oninput=e=>{search=e.target.value;$('assetRows').innerHTML=assetTable()};$('filter').onchange=e=>{filter=e.target.value;$('assetRows').innerHTML=assetTable()}}if(page==='movement'){const d=new Date(Date.now()+864e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('due').value=d.toISOString().slice(0,16);$('operation').onchange=()=>{const out=$('operation').value==='out';$('dueField').classList.toggle('hidden',!out);$('holderField').classList.toggle('hidden',!out);$('due').required=out};$('movementForm').onsubmit=move}if(page==='handover'){$('actual').oninput=()=>{const diff=Number($('actual').value)-(state.assets.length-count('out'));$('match').textContent=diff?'فرق العدد: '+diff:'مطابقة الأعداد';$('match').classList.toggle('error',!!diff)};$('handoverForm').onsubmit=e=>{e.preventDefault();if(role!=='keeper')return;if($('from').value===$('to').value)return toast('اختر مناوبين مختلفين');const x={time:iso(),from:$('from').value,to:$('to').value,actual:Number($('actual').value),expected:state.assets.length-count('out')};state.handover.unshift(x);log('محضر جرد تجريبي','—',`العدد ${x.actual} / ${x.expected}`);render();toast('تم حفظ المحضر محلياً')}}if(page==='audit')$('export').onclick=()=>{const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const rows=[['الوقت','الحركة','العينة','الدور','الوصف'],...state.log.map(x=>[x.time,x.action,x.asset,x.actor,x.note])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='demo-audit.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if(page==='settings'){$('prefsForm').onsubmit=e=>{e.preventDefault();if(role!=='manager')return;const keys={theme:'pref-theme',palette:'palette',size:'size',logo:'logo',density:'density'};for(const [k,id] of Object.entries(keys))prefs[k]=$(id).value;for(const k of ['distribution','alerts','activity'])prefs[k]=$('pref-'+k).checked;applyPrefs();toast(savePrefs()?'تم حفظ التخصيص على هذا المتصفح':'تعذر حفظ التخصيص')};$('resetPrefs').onclick=()=>{prefs={...uiDefaults};applyPrefs();const ok=savePrefs();render();toast(ok?'تمت استعادة الإعدادات الافتراضية':'تعذر حفظ الإعدادات')};}if(page==='settings')$('faq').onchange=e=>{$('answer').textContent={one:'اختر دور أمين المستودع ثم صفحة الخروج والإرجاع.',two:'تُخزن بيانات العرض في المتصفح نفسه فقط.',three:'لا. يتطلب الإنتاج مصادقة وتدقيقاً أمنياً واعتماد الاستضافة.'}[e.target.value]||''}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p)go(p.dataset.page);const b=e.target.closest('[data-detail]');if(b&&allowed[role].includes('assets')){const a=state.assets.find(x=>x.id===b.dataset.detail);if(!a)return;$('detail').innerHTML=`<h2>${esc(a.name)}</h2><p class="mono">${esc(a.id)}</p>${[['الحالة',labels[a.status]],['الوضع الفني',a.condition],['الملحقات',a.accessories],['موعد الإرجاع',date(a.due)],['الفحص القادم',date(a.service)]].map(([k,v])=>`<div class="lineitem"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}<form method="dialog" class="dialogfoot"><button class="btn">إغلاق</button></form>`;$('detail').showModal()}});$('role').onchange=e=>{role=e.target.value;go(allowed[role][0])};$('theme').onclick=()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();savePrefs();if(page==='settings')render()};applyPrefs();save();render();
</script></body></html>
