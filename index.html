function strengthPage(){return header('قوة المستودع','كشوفات النسخة التدريبية',`<button type="button" class="btn" data-page="home">العودة للوحة التحكم</button>`)+`<div class="strength-tabs" role="group" aria-label="أقسام قوة المستودع"><button type="button" class="card strength-tab" data-strength-tab="all" aria-pressed="${strengthTab==='all'}"><span aria-hidden="true" class="strength-icon">☷</span><b>القوة</b><small>جميع كشوفات العرض</small></button><button type="button" class="card strength-tab" data-strength-tab="pending" aria-pressed="${strengthTab==='pending'}"><span aria-hidden="true" class="strength-icon">!</span><b>الغير مسلم</b><small>لا توجد بيانات تسليم معتمدة</small></button></div>${strengthTab==='all'?demoReport(false,true):'<section class="card"><h2>الغير مسلم</h2><p class="empty">لا تتوفر بيانات تسليم معتمدة في هذه النسخة التدريبية. لا يمكن استنتاج العدد من حالة الصيانة أو الخروج.</p></section>'}`}
function bindStrength(){const tabs=document.querySelectorAll('[data-strength-tab]');tabs.forEach(btn=>{btn.onclick=()=>{const next=btn.dataset.strengthTab;if(next!=='all'&&next!=='pending')return;strengthTab=next;render()}})}
function demoReport(onlyOutside,embedded=false){const fixed=seed().assets;const rows=fixed.map(a=>{const v=state.assets.find(x=>x.id===a.id);return {...a,status:v&&Object.hasOwn(labels,v.status)?v.status:a.status}}).filter(a=>!onlyOutside||a.status==='out');return (embedded?'':header(onlyOutside?'الخارج من المستودع — عرض تدريبي':'كشوفات المستودع — عرض تدريبي','قائمة عينات افتراضية ثابتة',`<button type="button" class="btn" data-page="home">العودة للوحة التحكم</button>`))+`<section class="card"><p class="muted report-note">الرموز أدناه مخصصة للعرض فقط؛ لا تمثل أسلحة أو أرقاماً تسلسلية حقيقية.</p><div class="report-summary"><b>عدد سجلات العرض: ${rows.length}</b></div><div class="tablewrap"><table><thead><tr><th>رمز العينة</th><th>الوصف التدريبي</th><th>حالة العرض</th><th>معاينة الملصق</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b class="mono">${esc(a.id)}</b></td><td>${esc(a.name)}</td><td>${pill(a.status)}</td><td><button type="button" class="btn" data-sample-label="${esc(a.id)}">معاينة باركود تدريبي</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد عينات في هذه القائمة.</td></tr>'}</tbody></table></div></section>`}
function sampleLabel(id){const patterns=['121321123112','211231123121','132112311221','213121132112','112321213121','231121132112','123211312121','312121123211','121132213121','213112123211','112312321121','321121211321'];const match=seed().assets.findIndex(a=>a.id===id);if(match<0)return;const bars=patterns[match].split('').map(n=>'<i style="width:'+Number(n)*3+'px"></i>').join('');$('detail').innerHTML=`<h2>معاينة ملصق تدريبي</h2><div class="demo-pattern" aria-hidden="true">${bars}</div><p class="demo-watermark"><span class="mono">${esc(id)}</span> — نموذج غير قابل للمسح</p><p class="muted tiny">رسم توضيحي وليس باركوداً معيارياً أو ملصق تعريف حقيقي.</p><form method="dialog" class="dialogfoot"><button class="btn">إغلاق</button></form>`;$('detail').showModal()}
function recipientsPage(){const examples=[['شخص افتراضي 01','مجسم تدريبي أ'],['شخص افتراضي 02','مجسم تدريبي ب']];return header('الأشخاص المستلمون','معاينة شكل كشف المستلمين',`<button class="btn" data-page="home">العودة للوحة التحكم</button>`)+`<section class="card"><p class="muted report-note">أمثلة ثابتة لأغراض التصميم فقط. لا تمثل أشخاصاً أو أسلحة حقيقية، ولا ترتبط بسجلات الصرف أو الاستلام.</p><div class="tablewrap"><table><thead><tr><th>اسم المستلم الافتراضي</th><th>وصف العينة التدريبية</th></tr></thead><tbody>${examples.map(([name,sample])=>`<tr><td><b>${esc(name)}</b></td><td>${esc(sample)}</td></tr>`).join('')}</tbody></table></div></section>`}
function movement(){return header('الخروج والإرجاع','محاكاة حركة عينة تدريبية خاملة')+`<div class="card"><h2>تسجيل حركة تجريبية</h2><form id="movementForm"><div class="formgrid"><div class="field"><label for="operation">العملية</label><select id="operation"><option value="out">خروج</option><option value="in">إرجاع</option></select></div><div class="field"><label for="assetCode">رمز العينة التجريبي</label><select id="assetCode">${state.assets.map(a=>`<option value="${a.id}">${a.id} — ${a.name}</option>`).join('')}</select></div><div class="field" id="holderField"><label for="holder">المستلم التجريبي</label><select id="holder"><option>مستخدم تجريبي 01</option><option>مستخدم تجريبي 02</option><option>مستخدم تجريبي 03</option></select></div><div class="field" id="dueField"><label for="due">موعد الإرجاع</label><input id="due" type="datetime-local" required></div><div class="field full"><label for="condition">حالة العينة</label><select id="condition"><option>جيدة</option><option>تحتاج فحصاً</option></select></div></div><label class="check"><input id="confirm" type="checkbox" required> أؤكد أن هذه محاكاة ببيانات افتراضية فقط</label><button class="btn primary" type="submit">حفظ الحركة التجريبية</button><div id="result" aria-live="polite"></div></form></div>`}
function handover(){return header('محضر الجرد','مطابقة العينات التدريبية الخاملة في بيئة العرض')+`<div class="two"><div class="card"><h2>محضر مطابقة جديد</h2><form id="handoverForm"><div class="formgrid"><div class="field"><label>المسلم الافتراضي</label><select id="from"><option>مناوب أ</option><option>مناوب ب</option></select></div><div class="field"><label>المستلم الافتراضي</label><select id="to"><option>مناوب ب</option><option>مناوب أ</option></select></div><div class="field"><label for="actual">العدد المشاهد داخل المستودع</label><input id="actual" type="number" min="0" max="999" required value="${state.assets.length-count('out')}"></div><div class="field"><label>العدد المتوقع داخل المستودع</label><input readonly value="${state.assets.length-count('out')}"></div></div><div class="msg" id="match">مطابقة الأعداد</div><button class="btn primary" ${role==='keeper'?'':'disabled'}>حفظ المحضر</button></form></div><div class="card"><h2>ملخص الجرد</h2>${Object.entries(labels).map(([k,v])=>`<div class="lineitem"><span>${v}</span><b>${count(k)}</b></div>`).join('')}<div class="lineitem"><b>إجمالي العينات</b><b>${state.assets.length}</b></div></div></div><div class="card"><h2>المحاضر السابقة</h2>${state.handover.length?state.handover.map(x=>`<div class="lineitem"><span>${esc(x.from)} ← ${esc(x.to)}<br><small class="muted">${date(x.time)}</small></span><span class="pill ${x.actual!==x.expected?'late':''}">${x.actual} / ${x.expected}</span></div>`).join(''):'<p class="empty">لا توجد محاضر بعد.</p>'}</div>`}function logTable(rows){return `<div class="tablewrap"><table><thead><tr><th>الوقت</th><th>الحركة</th><th>العينة</th><th>الدور</th><th>الوصف</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${date(r.time)}</td><td>${esc(r.action)}</td><td><span class="mono">${esc(r.asset)}</span></td><td>${esc(r.actor)}</td><td>${esc(r.note)}</td></tr>`).join('')}</tbody></table></div>`}function audit(){return header('سجل النشاط','سجل محلي قابل للعرض والتصدير، وليس سجلاً محصناً ضد التلاعب',`<button class="btn" id="export">تصدير CSV</button>`)+`<div class="card">${logTable(state.log)}</div>`}function alertRows(){const a=alerts();return a.length?a.map(r=>`<div class="lineitem"><div><b>${r.title}</b><br><span class="tiny muted">${r.id} · ${r.detail}</span></div><span class="pill ${r.cls}">متابعة</span></div>`).join(''):'<p class="empty">لا توجد تنبيهات حالياً</p>'}function alertsPage(){return header('التنبيهات','تُحسب عند فتح الصفحة من بيانات العرض')+`<div class="card">${alertRows()}</div>`}function settings(){const select=(id,choices)=>'<select id="'+id+'">'+choices.map(([v,label])=>'<option value="'+v+'" '+(prefs[id]===v?'selected':'')+'>'+label+'</option>').join('')+'</select>';return header('إعدادات الموقع','تخصيص مظهر النسخة التجريبية على هذا المتصفح')+`<section class="card prefs-block"><h2>المظهر والهوية</h2><form id="prefsForm"><div class="formgrid"><div class="field"><label for="pref-theme">المظهر</label>${select('theme',[['light','فاتح'],['dark','داكن']]).replace('id="theme"','id="pref-theme"')}</div><div class="field"><label for="palette">ألوان الواجهة</label>${select('palette',[['green','أخضر'],['navy','أزرق داكن'],['slate','رمادي'],['olive','زيتي']])}</div><div class="field"><label for="size">حجم النص</label>${select('size',[['normal','عادي'],['large','كبير']])}</div><div class="field"><label for="logo">حجم الشعار (كمبيوتر)</label>${select('logo',[['small','صغير'],['normal','متوسط'],['large','كبير']])}</div><div class="field"><label for="density">تباعد البطاقات والجداول</label>${select('density',[['normal','عادي'],['compact','مضغوط']])}</div></div><h2>عناصر لوحة التحكم</h2><div class="prefs-options">${[['alerts','بطاقة التنبيهات'],['activity','بطاقة أحدث النشاطات']].map(([id,label])=>'<label class="check"><input type="checkbox" id="pref-'+id+'" '+(prefs[id]?'checked':'')+'> '+label+'</label>').join('')}</div><p class="muted tiny prefs-note">تخصيص العرض فقط؛ لا يغيّر السجلات أو الأدوار أو إعدادات الاستضافة. يبقى تنبيه النسخة التدريبية ظاهراً دائماً.</p><div class="prefs-actions"><button class="btn primary" type="submit">حفظ التخصيص</button><button type="button" class="btn" id="resetPrefs">استعادة الإعدادات الافتراضية</button></div></form></section><h2 style="margin-bottom:12px">حالة الربط</h2><div class="cards3">${[['GitHub','الكود المصدري','المستودع الرئيسي'],['Netlify','استضافة واجهة العرض','fdm1'],['Supabase','قاعدة البيانات والمصادقة والتخزين','الربط البرمجي غير مكتمل']].map(x=>`<div class="card"><div class="platform"><b>${x[0]}</b></div><p class="muted">${x[1]}</p><div style="margin-top:16px"><span class="tag">${x[2]}</span></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><h2>المساعد الإداري</h2><p class="muted">أسئلة تعريفية محلية، لا يوجد اتصال بنموذج AI خارجي.</p><select id="faq" style="margin:12px 0"><option value="">اختر سؤالاً</option><option value="one">كيف أجرب الحركة؟</option><option value="two">أين تُخزن البيانات؟</option><option value="three">هل النظام جاهز للإنتاج؟</option></select><div id="answer" class="muted"></div></div>`}
function msg(s,err=false){$('result').innerHTML=`<div class="msg ${err?'error':''}">${esc(s)}</div>`}function move(e){e.preventDefault();if(role!=='keeper')return;const a=state.assets.find(x=>x.id===$('assetCode').value),op=$('operation').value;if(!a||!$('confirm').checked)return msg('تأكد من البيانات',true);if(op==='out'&&a.status!=='in')return msg('العينة غير متاح للحركة التجريبية',true);if(op==='in'&&a.status!=='out')return msg('العينة غير مسجل خارج المستودع',true);const due=op==='out'?new Date($('due').value):null;if(due&&(!Number.isFinite(+due)||+due<=Date.now()))return msg('اختر موعداً مستقبلياً',true);a.status=op==='out'?'out':$('condition').value==='جيدة'?'in':'maint';a.holder=op==='out'?$('holder').value:'';a.due=due?due.toISOString():'';a.condition=$('condition').value;log(op==='out'?'خروج تجريبي':'إرجاع تجريبي',a.id,a.condition);$('confirm').checked=false;msg('تم تسجيل الحركة محلياً');}function bind(){if(page==='reports')bindStrength();if(page==='cabinets')bindCabinet();if(page==='qr')bindQR();if(page==='movement'){const d=new Date(Date.now()+864e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('due').value=d.toISOString().slice(0,16);$('operation').onchange=()=>{const out=$('operation').value==='out';$('dueField').classList.toggle('hidden',!out);$('holderField').classList.toggle('hidden',!out);$('due').required=out};$('movementForm').onsubmit=move}if(page==='handover'){$('actual').oninput=()=>{const diff=Number($('actual').value)-(state.assets.length-count('out'));$('match').textContent=diff?'فرق العدد: '+diff:'مطابقة الأعداد';$('match').classList.toggle('error',!!diff)};$('handoverForm').onsubmit=e=>{e.preventDefault();if(role!=='keeper')return;if($('from').value===$('to').value)return toast('اختر مناوبين مختلفين');const x={time:iso(),from:$('from').value,to:$('to').value,actual:Number($('actual').value),expected:state.assets.length-count('out')};state.handover.unshift(x);log('محضر جرد تجريبي','—',`العدد ${x.actual} / ${x.expected}`);render();toast('تم حفظ المحضر محلياً')}}if(page==='audit')$('export').onclick=()=>{const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const rows=[['الوقت','الحركة','العينة','الدور','الوصف'],...state.log.map(x=>[x.time,x.action,x.asset,x.actor,x.note])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='demo-audit.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if(page==='settings'){$('prefsForm').onsubmit=e=>{e.preventDefault();if(role!=='manager')return;const keys={theme:'pref-theme',palette:'palette',size:'size',logo:'logo',density:'density'};for(const [k,id] of Object.entries(keys))prefs[k]=$(id).value;for(const k of ['alerts','activity'])prefs[k]=$('pref-'+k).checked;applyPrefs();toast(savePrefs()?'تم حفظ التخصيص على هذا المتصفح':'تعذر حفظ التخصيص')};$('resetPrefs').onclick=()=>{prefs={...uiDefaults};applyPrefs();const ok=savePrefs();render();toast(ok?'تمت استعادة الإعدادات الافتراضية':'تعذر حفظ الإعدادات')};}if(page==='settings')$('faq').onchange=e=>{$('answer').textContent={one:'اختر دور أمين المستودع ثم صفحة الخروج والإرجاع.',two:'تُخزن بيانات العرض في المتصفح نفسه فقط.',three:'لا. يتطلب الإنتاج مصادقة وتدقيقاً أمنياً واعتماد الاستضافة.'}[e.target.value]||''}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p)go(p.dataset.page);const sample=e.target.closest('[data-sample-label]');if(sample&&['reports','outside'].includes(page)){sampleLabel(sample.dataset.sampleLabel);return}});const menuMedia=matchMedia('(max-width:900px)');let desktopMenuClosed=false;try{desktopMenuClosed=localStorage.getItem('ahda-menu-collapsed')==='1'}catch{}
function setMenu(closed,remember=false){$('siteLayout').classList.toggle('menu-collapsed',closed);$('menuToggle').setAttribute('aria-expanded',String(!closed));$('menuToggle').setAttribute('aria-label',closed?'فتح القائمة':'إغلاق القائمة');$('menuToggle').title=closed?'اضغط الشعار لفتح القائمة':'اضغط الشعار لإغلاق القائمة';$('menuBackdrop').hidden=closed||!menuMedia.matches;if(remember&&!menuMedia.matches){desktopMenuClosed=closed;try{localStorage.setItem('ahda-menu-collapsed',closed?'1':'0')}catch{}}}
function resetMenuForScreen(){setMenu(menuMedia.matches||desktopMenuClosed)}
$('menuToggle').onclick=()=>setMenu(!$('siteLayout').classList.contains('menu-collapsed'),true);$('menuBackdrop').onclick=()=>{setMenu(true);$('menuToggle').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('siteLayout').classList.contains('menu-collapsed')&&menuMedia.matches){setMenu(true);$('menuToggle').focus()}});$('nav').addEventListener('click',e=>{if(e.target.closest('[data-page]')&&menuMedia.matches){setMenu(true);$('menuToggle').focus()}});if(menuMedia.addEventListener)menuMedia.addEventListener('change',resetMenuForScreen);else menuMedia.addListener(resetMenuForScreen);resetMenuForScreen();
$('role').onchange=e=>{role=e.target.value;go(allowed[role][0])};$('theme').onclick=()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();savePrefs();if(page==='settings')render()};applyPrefs();save();render();
</script></body></html>
